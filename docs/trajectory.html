<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E19 Cilix NASA-Reference Flyby</title>
    <script>
      if (window.top === window.self) {
        const fullSiteUrl = new URL('index.html', window.location.href);
        fullSiteUrl.searchParams.set('page', 'trajectory-lab');
        window.location.replace(fullSiteUrl.href);
      }
    </script>
    <link rel="stylesheet" href="trajectory.css?v=e19-single-graph-20260716">
    <script defer src="data/e19-flyby.js?v=e19-cilix-20260715"></script>
    <script defer src="trajectory.js?v=e19-single-graph-20260716"></script>
  </head>
  <body>
    <main class="trajectory-page">
      <section class="trajectory-control" aria-label="E19 flyby time control">
        <div class="control-heading">
          <div>
            <p class="kicker">E19 trajectory control</p>
            <h2>Europa Clipper E19 near Cilix</h2>
          </div>
          <output id="time-output" for="time-slider">0 s</output>
        </div>
        <div class="control-row">
          <button id="play-button" type="button">Play flyby</button>
          <button id="closest-button" class="secondary-button" type="button">Closest approach</button>
          <input id="time-slider" type="range" min="-240" max="240" step="1" value="0" aria-label="Time from closest approach in seconds">
        </div>
        <dl class="live-values" aria-label="Current E19 flyby values">
          <div><dt>Altitude</dt><dd id="altitude-value"></dd></div>
          <div><dt>Ground track</dt><dd id="track-value"></dd></div>
          <div><dt>Sub-spacecraft</dt><dd id="subpoint-value"></dd></div>
          <div><dt>Flyby speed</dt><dd id="speed-value"></dd></div>
          <div><dt>Sun incidence</dt><dd id="incidence-value"></dd></div>
          <div><dt>Cilix range</dt><dd id="cilix-value"></dd></div>
          <div><dt>PRF risk</dt><dd id="alias-risk-value"></dd></div>
        </dl>
        <p id="trajectory-status" class="trajectory-status" role="status" aria-live="polite"></p>
      </section>

      <section class="trajectory-grid" aria-label="E19 trajectory dashboard graphs">
        <article class="graph-panel graph-panel-wide">
          <div class="graph-heading chart-style-heading">
            <div>
              <h2>Surface Height: E19 SPICE Altitude Profile</h2>
            </div>
            <span class="graph-source">SPICE E19</span>
          </div>
          <div id="trace-plot" class="plot e19-data-plot" aria-live="polite"></div>
        </article>
      </section>
    </main>
  </body>
</html>
